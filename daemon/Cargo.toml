[package]
name = "zero-nvim-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3.0"
rmpv = "1.3.0"
anyhow = "1.0"
# 关键修改：启用 vendored-openssl 以避免 macOS 系统库兼容性问题
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
base64 = "0.22"
